name: ${SCHEDULE_PROJECT:-schedule-nginx}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/prepare.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?Run deploy/prepare.py first}
      DATABASE_URL: postgresql://schedule:${POSTGRES_PASSWORD}@db:5432/schedule
      ALLOWED_HOSTS: ${DOMAIN:?Run deploy/prepare.py first}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      TRUST_PROXY: "1"
      TIME_ZONE: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging: *logging

  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/application-proxy.conf:/etc/nginx/application-proxy.conf:ro
      - static:/srv/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"Host: $$DOMAIN\" --header=\"X-Forwarded-Proto: https\" http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  database:
  static:
  media:
