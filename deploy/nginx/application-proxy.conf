proxy_pass http://app:8000;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Preserve the original non-standard port for URL generation and CSRF origins.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto $schedule_scheme;
proxy_set_header X-Forwarded-For $schedule_client_ip;
# Image OCR can take several minutes; keep the review request alive.
proxy_read_timeout 600s;
proxy_send_timeout 600s;
