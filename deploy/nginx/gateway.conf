# This gateway is reachable only through the host's loopback port.
map $http_x_forwarded_proto $schedule_scheme {
    default http;
    https https;
}
map $http_x_forwarded_for $schedule_client_ip {
    default $http_x_forwarded_for;
    "" $remote_addr;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    location /static/ {
        alias /srv/static/;
        # Asset names are stable, so browsers must revalidate after deployments.
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        return 404;
    }
    location = /healthz {
        access_log off;
        include /etc/nginx/application-proxy.conf;
    }
    location / {
        include /etc/nginx/application-proxy.conf;
    }
}
